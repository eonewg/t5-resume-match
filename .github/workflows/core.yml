name: A-D module integration
on:
  push:
    branches: [main, feat/core-a, feat/intelligence-d]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - name: Check owner branch and scope
        run: uv run --locked python -m scripts.check_scope --ci
      - run: uv run --locked ruff check backend tests scripts examples
      - run: uv run --locked ruff format --check backend tests scripts examples
      - run: uv run --locked pytest -q
      - name: Check required module contracts
        run: uv run --locked python -m scripts.check_member --ci
      - run: node scripts/check_frontend.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: t5_test
          POSTGRES_USER: t5_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t5_test -d t5_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      T5_DATABASE_URL: postgresql+psycopg://t5_test:ci-only-password@127.0.0.1:5432/t5_test
      T5_TEST_DATABASE_URL: postgresql+psycopg://t5_test:ci-only-password@127.0.0.1:5432/t5_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.migrate
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m scripts.smoke_postgres
