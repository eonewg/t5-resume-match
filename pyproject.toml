[project]
name = "t5-resume-match"
version = "0.1.0"
description = "T5 AI resume diagnosis and job matching integration core"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
